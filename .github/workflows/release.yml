name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. 1.10.2). Leave blank to use the current ref."
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-and-release:
    name: Build, attest, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build plugin
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f main.js
          test -f manifest.json
          test -f styles.css

      - name: Attest build provenance for main.js
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: main.js

      - name: Attest build provenance for styles.css
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: styles.css

      - name: Resolve tag name
        id: tag
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to existing release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — uploading assets with --clobber"
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            echo "Release $TAG does not exist — creating it"
            gh release create "$TAG" main.js manifest.json styles.css \
              --title "$TAG" \
              --notes "Automated release for $TAG. See CHANGELOG/commit log for details."
          fi
